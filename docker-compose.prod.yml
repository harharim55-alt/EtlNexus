services:
  db:
    container_name: db
    image: postgres:16-alpine
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=${DB_SHARED_BUFFERS:-256MB}"
      - "-c"
      - "work_mem=${DB_WORK_MEM:-16MB}"
      - "-c"
      - "effective_cache_size=${DB_EFFECTIVE_CACHE_SIZE:-512MB}"
      - "-c"
      - "maintenance_work_mem=${DB_MAINTENANCE_WORK_MEM:-64MB}"
      - "-c"
      - "max_connections=${DB_MAX_CONNECTIONS:-200}"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-etlnexus}
      POSTGRES_USER: ${POSTGRES_USER:-etlnexus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.prod}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-etlnexus} -d ${POSTGRES_DB:-etlnexus}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${DB_MEMORY_LIMIT:-2G}
    logging:
      driver: "json-file"
      options:
        max-size: "${LOG_MAX_SIZE:-50m}"
        max-file: "${LOG_MAX_FILES:-5}"

  # Single backend: serves the API, runs migrations on startup, and runs the
  # background scheduler (catalog mirror). One instance only.
  backend:
    container_name: backend
    image: etlnexus-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env.prod
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-etlnexus}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.prod}@db:5432/${POSTGRES_DB:-etlnexus}
      SCHEDULER_ENABLED: "true"
    networks:
      - backend
      - database
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${BACKEND_MEMORY_LIMIT:-2G}
    logging:
      driver: "json-file"
      options:
        max-size: "${LOG_MAX_SIZE:-50m}"
        max-file: "${LOG_MAX_FILES:-5}"

  frontend:
    container_name: frontend
    image: etlnexus-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    environment:
      BACKEND_HOST: backend
    networks:
      - frontend
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${FRONTEND_MEMORY_LIMIT:-256M}
    logging:
      driver: "json-file"
      options:
        max-size: "${LOG_MAX_SIZE_SMALL:-10m}"
        max-file: "${LOG_MAX_FILES_SMALL:-3}"

volumes:
  pgdata:

networks:
  frontend:
  backend:
  database:
