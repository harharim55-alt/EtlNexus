<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ETL Explorer Hub</title>
    <!-- Apply the saved theme before first paint (no flash-of-wrong-theme).
         Reads ONLY our own localStorage choice; the OS/browser light-dark
         preference is intentionally ignored so a given mode looks identical
         on every machine. `color-scheme` per mode (see index.css) then keeps
         native widgets in sync with the chosen mode, not the OS. -->
    <script>
      (function () {
        var t = "dark";
        try {
          var s = localStorage.getItem("etlnexus:theme");
          if (s === "light" || s === "dark") t = s;
        } catch (e) {}
        document.documentElement.setAttribute("data-theme", t);
      })();
    </script>
  </head>
  <body>
    <script src="/config.js"></script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
