services:
  # ============================================================================
  # Two-service stack: backend + frontend only.
  #
  # PostgreSQL, the LLM endpoint, Spark Connect, and the Keycloak (OIDC) server are
  # ALL EXTERNAL — this stack creates none of them. Point at your existing services
  # via .env:
  #   DB        -> POSTGRES_HOST / POSTGRES_DB_PORT / POSTGRES_USER / POSTGRES_PASSWORD /
  #                POSTGRES_DB  (or a full DATABASE_URL), DB_SCHEMA, DB_CREATE_DATABASE=false
  #   LLM       -> LLM_API_BASE_URL / LLM_API_KEY / LLM_MODEL
  #   Spark     -> SPARK_CONNECT_URL / SPARK_CATALOG_NAME
  #   Keycloak  -> SSO_ENABLED=true / SSO_ISSUER_URL / SSO_PUBLIC_ISSUER_URL / SSO_CLIENT_ID …
  # The frontend must also be allowed to reach Keycloak from the browser — set
  # CSP_CONNECT_SRC to include your Keycloak origin.
  # ============================================================================
  backend:
    container_name: backend
    image: etlnexus-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      # Assembled from the POSTGRES_* parts so the host/port/db are env-driven. To use a
      # full custom URL instead (e.g. with ?prepared_statement_cache_size=0), delete this
      # line and set DATABASE_URL in .env.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-etlnexus}:${POSTGRES_PASSWORD:-etlnexus}@${POSTGRES_HOST:-localhost}:${POSTGRES_DB_PORT:-5432}/${POSTGRES_DB:-ui_catalog_db}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${BACKEND_MEMORY_LIMIT:-2G}
    logging:
      driver: "json-file"
      options:
        max-size: "${LOG_MAX_SIZE:-50m}"
        max-file: "${LOG_MAX_FILES:-5}"

  frontend:
    container_name: frontend
    image: etlnexus-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    environment:
      # nginx proxies /api to this host; CSP_CONNECT_SRC must include your Keycloak
      # origin so the browser SPA can reach the external IdP.
      BACKEND_HOST: backend
      CSP_CONNECT_SRC: ${CSP_CONNECT_SRC:-}
    ports:
      - "${FRONTEND_PORT:-5173}:8080"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://localhost:8080/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${FRONTEND_MEMORY_LIMIT:-256M}
    logging:
      driver: "json-file"
      options:
        max-size: "${LOG_MAX_SIZE_SMALL:-10m}"
        max-file: "${LOG_MAX_FILES_SMALL:-3}"
