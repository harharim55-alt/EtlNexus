apiVersion: v1
kind: Service
metadata:
  name: {{ include "etlnexus.fullname" . }}-backend
  labels:
    {{- include "etlnexus.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    {{- include "etlnexus.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: {{ .Values.backend.port }}
      targetPort: {{ .Values.backend.port }}
