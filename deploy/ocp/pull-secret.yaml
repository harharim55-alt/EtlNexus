apiVersion: v1
kind: Secret
metadata:
  name: gitlab-pull
  # namespace: <your-namespace>
type: kubernetes.io/dockerconfigjson
stringData:
  # Replace <user> and <token> (a GitLab Deploy Token / PAT with read_registry).
  # <auth> = base64 of "<user>:<token>":
  #   PowerShell: [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("<user>:<token>"))
  #   bash:       echo -n '<user>:<token>' | base64
  # Self-hosted GitLab: replace registry.gitlab.com with your registry host.
  .dockerconfigjson: |
    {"auths":{"registry.gitlab.com":{"username":"<user>","password":"<token>","auth":"<auth>"}}}
