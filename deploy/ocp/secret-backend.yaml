apiVersion: v1
kind: Secret
metadata:
  name: etlnexus-backend-secret
  # namespace: <your-namespace>
type: Opaque
# stringData = plaintext in, OpenShift base64-encodes it for you.
# Do NOT commit real values to git — fill these in the console (Import YAML) instead.
stringData:
  # Full SQLAlchemy async URL, INCLUDING the password (that's why it's a Secret).
  DATABASE_URL: "postgresql+asyncpg://<user>:<password>@<host>:5432/<db>"
  # Keycloak confidential-client secret.
  SSO_CLIENT_SECRET: "<keycloak-client-secret>"
  # LLM API key (leave empty string if the endpoint needs none).
  LLM_API_KEY: "<llm-api-key>"
